# Publishes the public velvet.li site. Named "Website" rather than "Pages" on
# purpose: the template ships a workflow called "Velvet Pages" that builds an
# installation's own status page, and the two are unrelated.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velvet-website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build website
        run: bun run --filter @velvet/site website:build
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: velvet.li
          output: site/dist-website/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist-website

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
