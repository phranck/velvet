name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Lint code
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # No browser here. The tests that drive one are watched whilst they run
      # and are run on a machine with a screen; putting them on a runner meant
      # fetching Chromium and WebKit on every push, which took sixteen minutes
      # and thirty-six seconds of an eighteen-minute job against one minute and
      # fifty-two of testing. `test:headless` is everything that needs nothing
      # but Bun, and `bun run test` still runs the lot locally.
      # The man-page gate renders every page and fails on any roff diagnostic,
      # so it needs a renderer. Installed explicitly rather than relied upon,
      # because what a runner image happens to carry is not a contract.
      - name: Install the roff renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mandoc
      - name: Test
        run: bun run test:headless

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Verify committed build artefacts are current
        run: |
          if ! git diff --quiet; then
            echo "::error::The committed browser bundles do not match this source."
            echo "Run 'bun run build' and commit the result. Changed files:"
            git diff --name-only
            exit 1
          fi
