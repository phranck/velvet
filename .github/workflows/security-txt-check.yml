name: security.txt Check

on:
  schedule:
    # Monday mornings, early enough that a finding is waiting at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-txt-check
  cancel-in-progress: false

jobs:
  check:
    name: Check delivered security.txt
    runs-on: ubuntu-latest
    steps:
      - name: Check hosts and reconcile the host list
        uses: phranck/security-txt-action/check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-labels: security
          hosts: |
            velvet.li
          domains: |
            velvet.li
          ignore: |
            setup.velvet.li: built by Zerops from git rather than from a workflow, so no step here can produce its file yet
