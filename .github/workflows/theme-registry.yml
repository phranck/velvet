name: Theme registry

on:
  workflow_call:
    inputs:
      tooling-ref:
        description: Velvet ref containing the registry tooling
        required: false
        default: main
        type: string
      publish:
        description: Publish the validated registry to GitHub Pages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out theme content
        uses: actions/checkout@v7
        with:
          path: theme-content
      - name: Check out Velvet registry tooling
        uses: actions/checkout@v7
        with:
          repository: phranck/velvet
          ref: ${{ inputs.tooling-ref }}
          path: velvet-tooling
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: velvet-tooling/package.json
      - name: Validate themes and build registry
        run: >-
          bun velvet-tooling/scripts/build-theme-registry.mjs
          --themes theme-content/themes
          --output theme-content/dist/index.json
      - name: Configure Pages
        if: inputs.publish
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: theme-content/dist

  deploy:
    if: inputs.publish
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: velvet-themes-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
