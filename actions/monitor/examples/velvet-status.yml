# Wire the Velvet monitor into a repository by hand.
#
# A repository created through onboarding receives this workflow already, pinned
# to the exact revision its release was cut from. This copy is for adding Velvet
# to a repository yourself, so it tracks the `@v1` tag instead: the tag follows
# compatible releases, whilst a commit written down here would quietly fall
# behind the configuration contract and fail every run.
name: Velvet status

on:
  # Re-check as soon as the configuration changes, but not when the branch is
  # first created, since there is nothing to check yet.
  push:
    branches: [main]
    paths:
      - "velvet.yml"
      - ".github/workflows/velvet-status.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [velvet-monitor]
  # Planned maintenance is opened and closed as an issue, so the page has to be
  # rebuilt when one changes.
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: velvet-status-data
  cancel-in-progress: false

jobs:
  monitor:
    # An issues event only runs the monitor when the issue carries the
    # maintenance label AND its author has write access to this repository. The
    # label alone is not enough: a public repository lets anyone open an issue,
    # a template applies its own labels whatever the author's rights, and a
    # maintenance window suppresses incident reporting. Without the author gate
    # a stranger could hide a real outage. author_association is OWNER on a
    # personal repository, MEMBER or OWNER on an organisation one, and
    # COLLABORATOR for an invited collaborator; everyone with only read access
    # reads as NONE or CONTRIBUTOR and is refused.
    if: >-
      (github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000')
      && (github.event_name != 'issues'
          || ((github.event.label.name == 'maintenance' || contains(github.event.issue.labels.*.name, 'maintenance'))
              && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)))
    name: Check services
    runs-on: ubuntu-latest
    steps:
      - name: Check out status repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish Velvet status
        uses: phranck/velvet/actions/monitor@v1
        with:
          mode: status
        # Map only explicitly configured header secrets here, for example:
        # env:
        #   API_HEALTH_TOKEN: ${{ secrets.API_HEALTH_TOKEN }}
