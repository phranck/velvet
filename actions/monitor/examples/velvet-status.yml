name: Velvet status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [velvet-monitor]

permissions:
  contents: write
  issues: write

concurrency:
  group: velvet-status-data
  cancel-in-progress: false

jobs:
  monitor:
    name: Check services
    runs-on: ubuntu-latest
    steps:
      - name: Check out status repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish Velvet status
        uses: phranck/velvet/actions/monitor@1126eb1f6d531c2eff7f0958937574aa7aed2092
        with:
          mode: status
        # Map only explicitly configured header secrets here, for example:
        # env:
        #   API_HEALTH_TOKEN: ${{ secrets.API_HEALTH_TOKEN }}
