name: Velvet response times

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: velvet-status-data
  cancel-in-progress: false

jobs:
  monitor:
    name: Sample response times
    runs-on: ubuntu-latest
    steps:
      - name: Check out status repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish Velvet response times
        uses: phranck/velvet/actions/monitor@1126eb1f6d531c2eff7f0958937574aa7aed2092
        with:
          mode: response
        # Map the same explicitly configured header secrets as the status job.
