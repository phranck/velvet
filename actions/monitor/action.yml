name: "Run Velvet monitor"
description: "Check configured services and publish one validated Velvet data snapshot."
author: "phranck"
branding:
  icon: "activity"
  color: "purple"
inputs:
  mode:
    description: "Run status checks or collect response-time samples."
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: "1.3.14"
    - name: Install Velvet dependencies
      shell: bash
      env:
        VELVET_ROOT: ${{ github.action_path }}/../..
      run: bun install --cwd "$VELVET_ROOT" --frozen-lockfile --ignore-scripts
    - name: Build Velvet monitor
      shell: bash
      env:
        VELVET_ROOT: ${{ github.action_path }}/../..
      run: |
        bun run --cwd "$VELVET_ROOT" --filter @velvet/contracts build
        bun run --cwd "$VELVET_ROOT" --filter @velvet/monitor build
        bun run --cwd "$VELVET_ROOT" --filter @velvet/github-incidents build
    - name: Run Velvet monitor
      shell: bash
      env:
        VELVET_MODE: ${{ inputs.mode }}
        VELVET_ROOT: ${{ github.action_path }}/../..
        VELVET_WORKSPACE: ${{ github.workspace }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bun "$GITHUB_ACTION_PATH/src/cli.ts"
