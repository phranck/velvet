name: "Sync Velvet data"
description: "Normalize temporary Upptime inputs into one validated Velvet v1 snapshot."
author: "phranck"
branding:
  icon: "refresh-cw"
  color: "purple"
inputs:
  output:
    description: "Repository-relative directory ending in v1 for the Velvet documents."
    required: false
    default: "velvet-data/v1"
runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"
    - name: Install Velvet dependencies
      shell: bash
      env:
        VELVET_ROOT: ${{ github.action_path }}/../..
      run: bun --cwd "$VELVET_ROOT" install --frozen-lockfile --ignore-scripts
    - name: Publish Velvet data snapshot
      shell: bash
      env:
        VELVET_ROOT: ${{ github.action_path }}/../..
        VELVET_WORKSPACE: ${{ github.workspace }}
        VELVET_OUTPUT: ${{ inputs.output }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/sync.sh"
