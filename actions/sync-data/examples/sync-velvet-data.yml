name: Sync Velvet data

on:
  push:
    branches:
      - main
    paths:
      - ".upptimerc.yml"
      - "history/**"
      - ".github/workflows/sync-velvet-data.yml"
      - ".github/workflows/velvet.yml"
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  # This matches Upptime's mutation lock and prevents mixed source snapshots.
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  sync:
    name: Publish normalized data
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Sync Velvet data
        uses: phranck/velvet/actions/sync-data@v1
