# Replace the repository identity and service URL before the first run.
# A name and URL are enough for a direct IPv4 GET check. HTTP 200 is healthy.
schemaVersion: 1

repository:
  owner: your-username
  name: your-status-repo

statusPage:
  name: Example Status
  # The theme your page is published in. Velvet ships four: velvet,
  # retro-chassis, twenty-forty-nine and ncc-1701-d.
  theme: velvet

services:
  - name: Website
    url: https://example.com

history:
  retentionDays: 365
