# Build and deploy after the native monitor publishes a valid snapshot.
name: Velvet Pages

on:
  workflow_run:
    workflows: ["Velvet status", "Velvet response times"]
    types: [completed]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: velvet-pages
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch'
    name: Check services and publish initial data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out status repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish Velvet status
        uses: phranck/velvet/actions/monitor@v1
        with:
          mode: status
        # Map only explicitly configured header secrets here, for example:
        # env:
        #   API_HEALTH_TOKEN: ${{ secrets.API_HEALTH_TOKEN }}

  build:
    needs: monitor
    if: always() && ((github.event_name == 'workflow_dispatch' && needs.monitor.result == 'success') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    name: Build status page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out Velvet data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: velvet-data
          path: .velvet-data
      - name: Build Velvet site
        uses: phranck/velvet@v1
        with:
          config: velvet.yml
          data: .velvet-data/velvet-data/v1
          output: velvet-dist
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: velvet-dist

  deploy:
    needs: build
    # `always()` is what keeps this job alive. The monitor above it runs only on
    # a manual start, so on the ordinary path it is skipped, and a condition
    # without a status function keeps its implicit success check and inherits
    # that skip. The build already says this; without it here, every scheduled
    # run built a page and published none of it.
    if: always() && needs.build.result == 'success'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
