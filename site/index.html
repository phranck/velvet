<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0c0b" />
    <title>Status</title>
    <meta name="description" content="Live service status." />
    <!--
      No face is fetched here. Every design a page can be published in declares
      the faces it uses in its own `assets/fonts.css` and ships the files beside
      it, so a published page asks nobody for a font. Three links to Google
      stood here and fetched Inter a second time, which the Velvet design
      already carries: every visitor to every status page reached Google before
      the page could draw, and the promise that a published page loads nothing
      from anybody else was not kept.
    -->
    <link rel="icon" href="./src/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./src/assets/favicon-96.png" sizes="96x96" />
    <link rel="icon" href="./src/assets/favicon-128.png" sizes="128x128" />
    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
