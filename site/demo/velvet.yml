# Native IPv4 demo configuration used by the README screenshot workflow.
# The workflow runs this file through the same generate-config and build path as
# an installed status repository, so contract or build regressions fail before
# a new screenshot can be published.
schemaVersion: 1

repository:
  owner: velvet-underground
  name: status

statusPage:
  name: Velvet Underground Inc.
  layout: cards
  defaultRange: 90d
  theme:
    # Sunny Spring. Its yellow-green sets the picture apart from the indigo the
    # website and the onboarding are lit with, and it shows a real choice rather
    # than a palette invented for the screenshot.
    name: Sunny Spring
    palette:
      canvas: "#101713"
      foreground: "#f2f8e9"
      accent: "#78c850"
      alternate: "#f2cf4a"
      warning: "#e9a53b"
      danger: "#ef6868"
      textPrimary: "#f2f8e9"
      textSecondary: "#939a8f"
      textTertiary: "#585f57"
    grid:
      operational: accent
      degraded: warning
      outage: danger
      noData: auto
    chart:
      line: accent
      lineStyle: solid
      fill: true
  icons:
    website: ph-globe
    api: ph-brackets-curly
    database: ph-database
    cdn: ph-cloud-arrow-up
    auth: ph-lock-key
    mail: ph-envelope-simple

services:
  - name: Website
    url: https://velvet-underground.example
  - name: API
    url: https://api.velvet-underground.example/health
  - name: Database
    url: https://api.velvet-underground.example/health/db
  - name: CDN
    url: https://cdn.velvet-underground.example
  - name: Auth
    url: https://auth.velvet-underground.example/health
  - name: Mail
    url: https://api.velvet-underground.example/health/mail

history:
  retentionDays: 365
