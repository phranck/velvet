<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velvet theme</title>
    <!--
      One document, one theme. The stylesheet is linked rather than inlined so
      the theme's own typefaces and pictures resolve against their real
      addresses, exactly as they will once the page is published.
    -->
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="velvet-root"></div>
    <script type="module" src="./theme.ts"></script>
  </body>
</html>
