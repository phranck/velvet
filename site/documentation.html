<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0b0f" />
    <link rel="canonical" href="https://velvet.li/documentation" />
    <meta
      name="description"
      content="Every option velvet.yml accepts: services and checks, the status page, themes, incidents, retention, and managed updates."
    />
    <title>Velvet configuration reference</title>
    <link rel="icon" href="./src/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./src/assets/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
  </head>
  <body>
    <div id="documentation"></div>
    <script type="module" src="/src/documentation/main.ts"></script>
    <!--
      The only script this page publishes. It is written inline on purpose:
      the page is prerendered and its module bundle is removed, so a button
      that copies a block cannot be wired by the component that renders it.

      Each button is disabled in the markup and enabled here, which means a
      reader whose browser cannot copy, or who receives the document without
      this script running, is shown no control rather than a dead one.
    -->
    <script>
      (function () {
        if (!navigator.clipboard) return;
        for (const button of document.querySelectorAll("[data-copy-code]")) {
          const code = button.parentElement.querySelector("pre > code");
          if (!code) continue;
          button.disabled = false;
          button.addEventListener("click", async function () {
            // The numbers live in a column of their own, outside this
            // element, so a line's text is the line.
            //
            // Only text and elements are read all the same. The renderer
            // leaves anchor comments between the parts, and their textContent
            // is "[" and "]", which put a bracket around every copied line
            // until this filter named the node types it wanted rather than
            // the one it did not.
            const lines = [...code.querySelectorAll(".line")].map(function (line) {
              return [...line.childNodes]
                .filter(function (node) {
                  return (
                    node.nodeType === Node.TEXT_NODE ||
                    node.nodeType === Node.ELEMENT_NODE
                  );
                })
                .map(function (node) {
                  return node.textContent;
                })
                .join("");
            });
            try {
              await navigator.clipboard.writeText(lines.join("\n"));
              button.setAttribute("data-copied", "");
              setTimeout(function () {
                button.removeAttribute("data-copied");
              }, 3000);
            } catch {
              // A refused clipboard leaves the button as it was. Nothing is
              // claimed to have been copied that was not.
            }
          });
        }
      })();
    </script>
    <!--
      Marks the topic a reader is looking at, for the same reason the buttons
      above are wired here: the page ships no bundle, so nothing else can.

      Without this the sidebar still works. Every entry is an ordinary link to
      an ordinary anchor, so a reader whose script never runs can still reach
      any topic; only the mark showing where they are is missing.
    -->
    <script>
      (function () {
        const headings = [...document.querySelectorAll("[data-topic]")];
        const links = new Map(
          [...document.querySelectorAll("[data-topic-link]")].map(function (link) {
            return [link.dataset.topicLink, link];
          }),
        );
        if (headings.length === 0 || links.size === 0) return;

        let marked = null;
        function mark() {
          // The last heading that has passed the line the sticky bar leaves
          // free, which is the one whose content fills the screen. Before the
          // first has passed it, the first is the one being read.
          const line = 120;
          let current = headings[0];
          for (const heading of headings) {
            if (heading.getBoundingClientRect().top <= line) current = heading;
            else break;
          }
          const link = links.get(current.dataset.topic);
          if (!link || link === marked) return;
          if (marked) marked.removeAttribute("data-current");
          link.setAttribute("data-current", "");
          marked = link;
        }

        // Passive, because this never prevents the scroll it observes, and
        // reading a rectangle is cheap enough not to need throttling.
        addEventListener("scroll", mark, { passive: true });
        addEventListener("resize", mark, { passive: true });
        mark();
      })();
    </script>
  </body>
</html>
