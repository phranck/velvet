# A filthy pane of glass with a dim blue readout.

name = "Twenty Forty-Nine"
description = "A filthy pane of glass with a dim blue readout: corner brackets, edge scales, dotted grids, and a vignette to black."
era = "2049"
version = "1.0.0"

# Where it stands in the list an operator chooses from, lowest first.
order = 3

# A withdrawn theme keeps every installation already published in it and is
# offered to nobody new.
state = "offered"

# The shape of the status data this theme understands.
dataVersion = 1

layouts = ["grouped", "cards"]
readings = "overlay"

# The element this theme's page is rooted at. What an operator sets is written
# onto it, so their value stands where this theme's own declarations stand and
# wins over them rather than being inherited into a losing position.
root = ".twenty-forty-nine-page"

# The colours the picture of this page is drawn with, which somebody sees when
# they share its address. The card is rasterised without a browser, so it cannot
# read this stylesheet and is told instead.
[card]
backgroundStart = "#05101c"
backgroundEnd = "#05101c"
surface = "#091726"
surfaceEdge = "#23506e"
operational = "#3f8fa3"
degraded = "#b0822f"
outage = "#c03a4e"
noData = "#131e21"
ipv4 = "#5fb2e0"
ipv6 = "#c2913f"
textPrimary = "#bdd2e0"
textSecondary = "#7796ab"
textTertiary = "#63839d"
clouds = false

[entries]
template = "template.ts"
styles = "theme.css"
script = "script.ts"

# The wash under the response curve, which this theme draws the same way
# Velvet does and switches off the same way.
[features.chartWash]
type = "switch"
label = "Wash under the response curve"
group = "Response chart"
property = "--chart-area-display"
default = true
on = "block"
off = "none"

[features.ipv4Colour]
type = "colour"
label = "IPv4 colour"
group = "Protocols"
declared = true
property = "--protocol-ipv4"
default = "#5fb2e0"

[features.ipv6Colour]
type = "colour"
label = "IPv6 colour"
group = "Protocols"
declared = true
property = "--protocol-ipv6"
default = "#c2913f"

[features.contentWidth]
type = "choice"
label = "Content width"
group = "Page"
property = "--page-width"
default = "1080px"
choices = [
  { value = "880px", label = "Narrow" },
  { value = "1080px", label = "Ordinary" },
  { value = "1320px", label = "Wide" },
]
