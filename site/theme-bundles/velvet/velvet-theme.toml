# The page Velvet publishes today, and the one every other theme is measured against.

name = "Velvet"
description = "The page Velvet publishes today: a dark indigo readout, one card per group of services, and a strip of days under each of them."
era = "today"
version = "1.0.0"

# Where it stands in the list an operator chooses from, lowest first.
order = 1

# A withdrawn theme keeps every installation already published in it and is
# offered to nobody new.
state = "offered"

# The shape of the status data this theme understands.
dataVersion = 1

layouts = ["grouped", "cards"]
readings = "overlay"

[entries]
template = "template.ts"
styles = "theme.css"
script = "script.ts"

# The wash under the response curve. A theme reads its features through the
# property named here, and the build writes that property whether or not
# anybody set it, so there is one answer rather than a value here and a
# fallback in the stylesheet.
[features.chartWash]
type = "switch"
label = "Wash under the response curve"
property = "--chart-area-display"
default = true
on = "block"
off = "none"
