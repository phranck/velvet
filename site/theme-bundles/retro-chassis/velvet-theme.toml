# A rack of separate components, each service a brushed faceplate bolted between two walnut cheeks.

name = "Retro Chassis"
description = "A rack of separate components: each service is a brushed faceplate bolted between two walnut cheeks, with a lit name plate, two protocol lamps, a two-line readout and a lamp meter for its days."
era = "1979"
version = "1.0.0"

# Where it stands in the list an operator chooses from, lowest first.
order = 2

# A withdrawn theme keeps every installation already published in it and is
# offered to nobody new.
state = "offered"

# The shape of the status data this theme understands.
dataVersion = 1

layouts = ["cards"]
readings = "panel"

# The element this theme's page is rooted at. What an operator sets is written
# onto it, so their value stands where this theme's own declarations stand and
# wins over them rather than being inherited into a losing position.
root = ".retro-chassis-page"

# The colours the picture of this page is drawn with, which somebody sees when
# they share its address. The card is rasterised without a browser, so it cannot
# read this stylesheet and is told instead. The three state colours are what
# this theme's own `color-mix` resolves to, since that needs a browser.
[card]
backgroundStart = "#191714"
backgroundEnd = "#191714"
surface = "#141518"
surfaceEdge = "#3b342a"
operational = "#647a3f"
degraded = "#a2722b"
outage = "#8c521d"
noData = "#222326"
ipv4 = "#e8a33d"
ipv6 = "#8fae5a"
textPrimary = "#e6dcc4"
textSecondary = "#a89a7c"
textTertiary = "#8a7f65"
clouds = false

[entries]
template = "template.ts"
styles = "theme.css"
script = "script.ts"
