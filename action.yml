name: "Velvet status page"
description: "Build a GitHub-native Velvet status page from validated configuration and data."
author: "phranck"
branding:
  icon: "activity"
  color: "purple"
inputs:
  config:
    description: "Path to the native Velvet configuration in the consumer repository."
    required: false
    default: "velvet.yml"
  data:
    description: "Path to the checked-out Velvet v1 data documents."
    required: false
    default: ".velvet-data/velvet-data/v1"
  output:
    description: "Directory (in the consumer workspace) to write the built site into."
    required: false
    default: "velvet-dist"
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"
    - name: Build Velvet site
      shell: bash
      env:
        VELVET_CONFIG: ${{ inputs.config }}
        VELVET_DATA: ${{ inputs.data }}
        VELVET_OUTPUT: ${{ inputs.output }}
        VELVET_ROOT: ${{ github.action_path }}
        VELVET_SITE: ${{ github.action_path }}/site
      run: |
        set -euo pipefail
        # The data path is given relative to the repository being built, whilst
        # the site build runs with its working directory inside the Action. It
        # is made absolute here, where the working directory is still the
        # repository, so the build can read the documents it renders from.
        #
        # A repository whose first check has not run yet has no such directory.
        # It is then left exactly as given, the build finds nothing to render
        # from, and the page fetches its own data as it did before it rendered
        # any. The steps below read this path too, and are unaffected either
        # way, an absolute path naming the same directory.
        if [ -d "$VELVET_DATA" ]; then
          VELVET_DATA="$(cd "$VELVET_DATA" && pwd)"
        else
          echo "velvet: no data at $VELVET_DATA, publishing without a prerender"
        fi
        export VELVET_DATA
        bun install --cwd "$VELVET_ROOT" --frozen-lockfile
        bun run --cwd "$VELVET_ROOT" --filter @velvet/contracts build
        bun "$VELVET_SITE/scripts/generate-config.mjs" "$VELVET_CONFIG" "$VELVET_SITE/public/config.json"
        # A logo beside velvet.yml is copied into the published site, where the
        # relative path the configuration names resolves. It belongs to whoever
        # installed Velvet, so none of the four names is required to be there.
        for logo in logo.svg logo.png logo.webp logo.jpg; do
          if [ -f "$logo" ]; then
            cp "$logo" "$VELVET_SITE/public/$logo"
          fi
        done
        bun run --cwd "$VELVET_ROOT" --filter @velvet/site build
        bun "$VELVET_SITE/scripts/generate-og.ts" "$VELVET_SITE/public/config.json" "$VELVET_DATA/status.json" "$VELVET_SITE/dist/og.png"
        bun "$VELVET_SITE/scripts/generate-seo.ts" "$VELVET_SITE/public/config.json" "$VELVET_DATA/status.json" "$VELVET_SITE/dist"
        cp "$VELVET_ROOT/LICENSE" "$VELVET_SITE/dist/LICENSE"
        cp "$VELVET_ROOT/THIRD_PARTY_NOTICES.md" "$VELVET_SITE/dist/THIRD_PARTY_NOTICES.md"
        rm -rf "$VELVET_OUTPUT"
        mkdir -p "$VELVET_OUTPUT"
        cp -R "$VELVET_SITE/dist/." "$VELVET_OUTPUT/"
        echo "velvet: built into $VELVET_OUTPUT"
